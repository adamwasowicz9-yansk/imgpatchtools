name: Inspect imgpatchtools

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect imgpatchtools
        run: |
          git clone https://github.com/adamwasowicz9-yansk/imgpatchtools.git

          echo "===== ROOT ====="
          ls -lah imgpatchtools

          echo ""
          echo "===== FILES ====="
          find imgpatchtools -maxdepth 3 -type f | sort

          echo ""
          echo "===== BUILD FILES ====="
          find imgpatchtools \
            \( -name Makefile -o -name makefile -o -name CMakeLists.txt -o -name "*.mk" \) \
            | sort
