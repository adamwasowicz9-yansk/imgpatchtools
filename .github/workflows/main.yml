name: Test imgpatchtools

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build imgpatchtools
        run: |
          git clone https://github.com/adamwasowicz9-yansk/imgpatchtools.git

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            zlib1g-dev \
            libbz2-dev \
            libssl-dev

          cd imgpatchtools

          make -j"$(nproc)"

          echo "===== OUTPUT ====="

          find . -type f -executable | sort
